<!DOCTYPE html>  <html lang="fa" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>هوش مصنوعی کوچولو</title>  <style>  
   
html, body{
  margin: 0;  
  min-height: 100%;  
}  
  
body{  
  min-height: 100vh;  
  background: linear-gradient(  
    to bottom left,  
    #511b1ecb,  
    #323363ca,  
    #aab5ff4a  
  );  
}  
  
 
</style>  </head>  <body>  <input id="q" placeholder="بنویس"  
onkeydown="if(event.key==='Enter') go()">

<button onclick="go()">ارسال</button>

<p id="a"></p>  <button onclick="clearAnswer()">پاک‌کردن پاسخ</button>
<input type="color" id="myColor">
<input type="color" id="color2">

<script>  
let oldAnswer = localStorage.getItem("lastAnswer") || "";  
document.getElementById("a").innerText = oldAnswer;  
  function cleanText(text) {
  return text
    .replace(/[؟?!.،]/g, "")
    .replace(/\s+/g, "")
    .trim();
}
function go() {  
  let q = document.getElementById("q").value.trim();  
  document.getElementById("q").value = "";  
  
  let a = document.getElementById("a");  
  
q = cleanText(q);
  
  let answered = false;  
  a.innerText = "";  
  
  if (q.includes("سلام")) {  
    a.innerText += "سلام رفیق";  
    answered = true;  
  }  
  
  if (q.includes("خوبی")) {  
    a.innerText += " من خوبم!";  
    answered = true;  
  }  
  else if (q == "تو") {  
    a.innerText = "من هوش مصنوعی خیلی کوچولو هستم";  
    answered = true;  
  }  
  else if (q == "چکارمیکنی") {  
    a.innerText = "دارم به سوالات پاسخ میدم دیگه";  
    answered = true;  
  }  
  
else if (q == "زنبورسفیده") {  
    a.innerText = " نه خب قطعا زرد ومشکیه😐";  
    answered = true;  
    }
   
     if (
  q.includes("اسمت چیه") ||
  q.includes("تو کی هستی") ||
  q.includes("چی هست ") ||
  q.includes("تو کی ")) {
  a.innerText = " من پویایaiهستم";
  answered = true;}
  
  if (!answered) {  
    a.innerText = "نمی‌دونم!";  
  }  
  
  localStorage.setItem("lastAnswer", a.innerText);  
}  
  
  
function clearAnswer() {  
  document.getElementById("a").innerText = "";  
  localStorage.removeItem("lastAnswer");  
}  

let color1 = document.getElementById("myColor");
let color2 = document.getElementById("color2");

color1.value = localStorage.getItem("color1") || "#511b1e";
color2.value = localStorage.getItem("color2") || "#aab5ff";

function changeGradient() {
  document.body.style.background =
    `linear-gradient(to bottom left, ${color1.value}, ${color2.value})`;

  localStorage.setItem("color1", color1.value);
  localStorage.setItem("color2", color2.value);
}

color1.oninput = changeGradient;
color2.oninput = changeGradient;

changeGradient();
</script>  </body>  
</html>
