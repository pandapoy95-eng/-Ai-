
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوش مصنوعی کوچولو</title>
<h3 style="color:green">پویای aiورژن جدید رو نمایی میکند</h3>
<style>
html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: linear-gradient(
    to bottom left,
    #511b1ecb,
    #323363ca,
    #aab5ff4a
  );
}#history p {
  background: #323363;
  color: white;
  padding: 2px;
  border-radius: 5px;
  margin: 3px 0;
 } 
#history p {
  width: fit-content;
  max-width: 40%;
}
</style>
</head>

<body>

<input id="q" placeholder="بنویس"
onkeydown="if(event.key==='Enter') go()">

<button onclick="go()">ارسال</button>

<p id="a"></p>
<div id="history"></div>

<button onclick="clearAnswer()">پاک‌کردن پاسخ</button>

<input type="color" id="myColor">
<input type="color" id="color2">

<script>
let history = document.getElementById("history");

let messages = JSON.parse(
  localStorage.getItem("chatHistory") || "[]"
);

let oldAnswer = localStorage.getItem("lastAnswer") || "";
document.getElementById("a").innerText = oldAnswer;

function cleanText(text) {
  return text
    .replace(/[\u200c\u200f\u200e]/g, "")
    .replace(/[؟?!.،]/g, "")
    .replace(/\s+/g, "")
    .trim();
}

function showHistory() {
  history.innerHTML = "";

  messages.forEach(function(message) {
    let p = document.createElement("p");
    p.innerText = message;
    history.appendChild(p);
  });
}

showHistory();

function go() {
  let input = document.getElementById("q");
  let originalQ = input.value.trim();

  if (originalQ === "") return;

  input.value = "";

  let q = cleanText(originalQ);
  let a = document.getElementById("a");
  let answered = false;

  a.innerText = "";
if (
  q.includes("منچیگفتم") ||
  q.includes("چیگفتم")
) {
  let lastMessage = messages.filter(
    m => m.startsWith("تو: ")
  );

  if (lastMessage.length > 1) {
    a.innerText = lastMessage[lastMessage.length - 2].replace("تو: ", "");
  } else {
    a.innerText = "هنوز پیام قبلی‌ای نداری 😊";
  }

  answered = true;
}
  if (q.includes("سلام")) {
    let replies = [
      "سلام رفیق",
      "سلامممممممم",
      "درود"
    ];

    a.innerText = replies[
      Math.floor(Math.random() * replies.length)
    ];answered = true;}
    
if (
  q.includes("خوبی") ||
  q.includes("حالتچطوره") ||
  q.includes("چطوری")
) {
  a.innerText = "من خوبم رفیق 😊 تو چطوری؟";
  answered = true;
}

  else if (q === "تو") {
    a.innerText = "من هوش مصنوعی خیلی کوچولو هستم";
    answered = true;
  }
  else if (q === "چکارمیکنی") {
    a.innerText = "دارم به سوالات پاسخ میدم دیگه";
    answered = true;
  }
  else if (q === "زنبورسفیده") {
    a.innerText = "نه خب قطعاً زرد و مشکیه "
      answered = true;
  }
  
if (
  q.includes("مرسییی") ||
  q.includes("دمتگرم") ||
  q.includes("افرین")
) {
  a.innerText = "خواهش میکنم بابا ";
  answered = true;
}

  if (
    q.includes("ببخشید") ||
    q.includes("معذرت") ||
    q.includes("شرمنده")
  ) {
    a.innerText = "اشکالی نداره حق داری 🥲";
    answered = true;
  }

  if (
    q.includes("نهه") ||
    q.includes("نمیخوام") ||
    q.includes("نیستم") ||
    q.includes("اهه")
  ) {
    a.innerText = "ناراحت یا عصبانی نباش 🫠🙃";
    answered = true;
  }

  if (
    q.includes("اسمتچیه") ||
    q.includes("توکیهستی") ||
    q.includes("چیهستی") ||
    q.includes("توکی")
  ) {
    a.innerText = "ورژن ۱.۵من پویای AI هستم";
    answered = true;
  }

  if (!answered) {
    a.innerText = "نمی‌دونم!";
  }

  localStorage.setItem("lastAnswer", a.innerText);

  messages.push("کاربر: " + originalQ);
  messages.push("هوش مصنوعی: " + a.innerText);

  localStorage.setItem(
    "chatHistory",
    JSON.stringify(messages)
  );

  showHistory();
}

function clearAnswer() {
  document.getElementById("a").innerText = "";
  localStorage.removeItem("lastAnswer");

  messages = [];
  localStorage.removeItem("chatHistory");

  showHistory();

  document.getElementById("a").innerText = "";
  localStorage.removeItem("lastAnswer");
}

let color1 = document.getElementById("myColor");
let color2 = document.getElementById("color2");

color1.value = localStorage.getItem("color1") || "#511b1e";
color2.value = localStorage.getItem("color2") || "#aab5ff";

function changeGradient() {
  document.body.style.background =
    `linear-gradient(to bottom left, ${color1.value}, ${color2.value})`;

  localStorage.setItem("color1", color1.value);
  localStorage.setItem("color2", color2.value);
}

color1.oninput = changeGradient;
color2.oninput = changeGradient;

changeGradient();
</script>

</body>
</html>
